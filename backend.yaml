apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-stable-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-svc-stable
  template:
    metadata:
      labels:
        app: payment-svc-stable
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:1.0.0
        args: ["-text=[STABLE-V1] Payment Request Processed Successfully"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: payment-svc-stable
  namespace: default
spec:
  ports:
  - port: 8001          
    targetPort: 5678
    protocol: TCP
  selector:
    app: payment-svc-stable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-canary-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-svc-canary
  template:
    metadata:
      labels:
        app: payment-svc-canary
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:1.0.0
        args: ["-text= [CANARY-V2] Processing Payment via New High-Speed Rail API"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: payment-svc-canary
  namespace: default
spec:
  ports:
  - port: 8001          
    targetPort: 5678
    protocol: TCP
  selector:
    app: payment-svc-canary